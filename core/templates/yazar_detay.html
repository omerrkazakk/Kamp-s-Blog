{% extends "base.html" %}
{% load static %}
{% block baslik %}{{ title }}{% endblock %}
{% block icerik %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 rounded-4 overflow-hidden">
                <div class="card-body p-5 text-center">
                    
                    <div class="mb-4">
                        <i class="bi bi-person-circle text-primary" style="font-size: 90px; line-height: 1;"></i>
                    </div>
                    
                    <h2 class="fw-bold mb-2">{{ author.full_name }}</h2>
                    
                    <span class="badge bg-light text-primary fs-6 px-3 py-2 rounded-pill mb-4 border border-primary-subtle">
                        {{ author.title }}
                    </span>
                    
                    <hr class="my-4 mx-auto w-25 text-muted">
                    
                    <div class="text-start px-3">
                        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-file-earmark-person me-2"></i>Hakkında</h5>
                        <p class="card-text text-secondary lh-lg" style="white-space: pre-line;">
                            {{ author.bio }}
                        </p>
                    </div>
                    
                    <div class="mt-5 pt-3 border-top text-start px-3">
                        <a href="{% url 'yazarlar' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="bi bi-arrow-left me-2"></i>Yazarlarımıza Geri Dön
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
